[server]
# Only accept connections from this computer, not from other devices on the network.
address = "localhost"

[browser]
# Keep everything local: don't send anonymous usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Hide the "Deploy" button; this app is meant to run locally.
toolbarMode = "minimal"

# Two themes: dark (the primary design) and light. Streamlit starts on the computer's
# light/dark setting; a viewer can switch in the menu (Settings > Light / Dark / System),
# and that choice is remembered in their browser. Keep these colours in step with
# LIGHT and DARK in aether_ui/theme.py.
[theme]
baseRadius = "0.5rem"

[theme.light]
primaryColor = "#6D28D9"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#18181B"
borderColor = "#E4E4E7"

[theme.dark]
primaryColor = "#8B5CF6"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#17171B"
textColor = "#EDEDEF"
borderColor = "#26262B"
codeBackgroundColor = "#111114"
